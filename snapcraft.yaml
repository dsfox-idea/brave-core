# Growser as a snap (growser#226).
#
# Adapted from Brave's own snapcraft.yaml, which this file replaces: they
# publish a snap of this same Chromium fork, verified, in STRICT confinement on
# core22, and so do Opera and Vivaldi. Every browser snap in the store is
# strict, which is why none of this needs the manual approval classic
# confinement would.
#
# The version and the source URL are rewritten by scripts/linux/make-snap.sh
# for each release. They are literal here on purpose: Brave's file builds the
# URL out of $SNAPCRAFT_PROJECT_VERSION next to another variable, and where one
# variable name ends and the next begins is not something to find out from a
# broken download.
name: growser
version: 26.909.2
grade: stable
architectures:
  - build-on: amd64
summary: A Chromium browser for safe and comfy growsing.
description: |
 Growser blocks advertising and tracking by default, reports nothing about
 what you browse to anyone, and carries no telemetry: the metrics and
 web-discovery services are compiled out rather than switched off.
confinement: strict
compression: lzo
base: core22
apps:
  growser:
    command: opt/growser/growser
    desktop: usr/share/applications/growser.desktop
    extensions:
      - gnome
    environment:
      GTK_USE_PORTAL: 1
      # Read by GetDesktopName() (growser#225), which hands the answer to
      # xdg-settings. Brave's file also sets BRAVE_DESKTOP and
      # BRAVE_CONFIG_HOME; neither is read anywhere in this tree or in
      # Chromium's - checked - so they are not carried over.
      GROWSER_SNAP: 1
    plugs:
      - audio-playback
      - audio-record
      - bluez
      - camera
      - cups-control
      - hardware-observe
      - home
      - joystick
      - mount-observe
      - network
      - network-bind
      - network-manager
      - opengl
      - password-manager-service
      - pulseaudio
      - raw-usb
      - removable-media
      - screen-inhibit-control
      - system-packages-doc
      - u2f-devices
      - unity7
      - upower-observe
    slots:
      - mpris
plugs:
  browser-sandbox:
    interface: browser-support
    allow-sandbox: true
slots:
  mpris:
    interface: mpris
    name: growser
parts:
  growser:
    plugin: dump
    source: https://growser.org/apt/pool/main/g/growser/growser_26.909.2_amd64.deb
    override-pull: |
      set -eu
      craftctl default
      # The sandbox binary must keep its setuid bit or the browser refuses to
      # start; the dump plugin does not preserve it.
      chmod 4555 ./opt/growser/chrome-sandbox
      # The launchers on PATH belong to the deb, not to a snap: snapd provides
      # its own. Brave also removes etc/cron.daily here, which is a no-op for
      # us - growser#207 took the cron out of the package.
      rm -rf usr/bin/growser usr/bin/growser-stable
      # The icon has to be a path inside the snap rather than a theme name.
      sed -i 's|Icon=growser|Icon=/opt/growser/product_logo_128\.png|g' usr/share/applications/growser.desktop
    prime:
      - -etc/gss
      - -etc/init.d
      - -etc/sensors.d
      - -etc/ucf.conf
      - -etc/xdg
      - -usr/include
      - -usr/lib/tmpfiles.d
      - -usr/share/apport
      - -usr/share/bash-completion
      - -usr/share/bug
      - -usr/share/doc
      - -usr/share/doc-base
      - -usr/share/gettext
      - -usr/share/gnome-control-center
      - -usr/share/GConf
      - -usr/share/icons
      - -usr/share/lintian
      - -usr/share/man
      - -usr/share/pam-configs
      - -usr/share/pkgconfig
      - -usr/share/polkit-1
      - -usr/share/session-migration
      - -usr/share/sounds
      - -usr/share/ubuntu
      - -usr/share/ubuntu-wayland
      - -usr/share/upstart
      - -usr/share/zsh
      - -var

  # A symlink xdg-email -> xdg-open, because xdg-open handles mailto: perfectly
  # well and the snap has no xdg-email (https://launchpad.net/bugs/1849774).
  # Brave's file also ships man-db and groff so that `man growser` works inside
  # the snap; that is a nicety with four stage-packages behind it and no
  # bearing on the browser, so it is not carried over - usr/share/man is
  # pruned above instead.
  xdg-email:
    plugin: nil
    override-pull: ""
    override-prime: |
      set -eux
      mkdir -p usr/bin
      cp /snap/core22/current/usr/bin/xdg-open usr/bin
      cd usr/bin
      ln -s xdg-open xdg-email
