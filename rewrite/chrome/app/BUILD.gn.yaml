substitutions:
  # This substitution matches with the `grit_strings("generated_resources")`
  # block, and adds our line just as the last line before the block closes.
  - description:
      "Adding brave_generated_resources_grit to Chromium's resources."
    regex:
      re_pattern: '(grit_strings\("generated_resources"\) {[\s\S]*?)(^})'
      re_flags: [MULTILINE]
      replace: '\1  deps = [ "//brave/app:brave_generated_resources_grit" ]\n\2'

  # Define IS_BRAVE_ORIGIN_BRANDED for chrome_dll_resources when building with
  # is_brave_origin_branded=true so chrome_dll.rc picks the brave_origin icons.
  # This is what gets loaded for the per-window HICON via WM_SETICON, which is
  # what Windows shows in the alt+tab task switcher.
  - description: 'Add IS_BRAVE_ORIGIN_BRANDED define to chrome_dll_resources.'
    regex:
      re_pattern:
        '(source_set\("chrome_dll_resources"\)
        {[\s\S]*?"//printing/buildflags",\n    \])'
      re_flags: [MULTILINE]
      replace:
        '\1\n    import("//brave/components/brave_origin/buildflags/buildflags.gni")
        if (is_brave_origin_branded) { defines = [ "IS_BRAVE_ORIGIN_BRANDED" ] }'

  # growser (#146): the same define, for the same reason the comment above
  # gives - this .rc is where a RUNNING window gets its icon, so it is the copy
  # a person actually sees. Colouring only the .exe left every window green
  # while the file and its shortcuts were red. Appended after the Brave line
  # because that line is what this anchors on, and `defines` may not exist yet
  # when we are not origin-branded.
  - description: 'Add GROWSER_PUBLIC_RELEASE define to chrome_dll_resources.'
    regex:
      re_pattern:
        '(if \(is_brave_origin_branded\) \{ defines = \[ "IS_BRAVE_ORIGIN_BRANDED"
        \] \})'
      replace:
        '\1 import("//brave/build/growser.gni") if (growser_public_release) {
        if (defined(defines)) { defines += [ "GROWSER_PUBLIC_RELEASE" ] } else {
        defines = [ "GROWSER_PUBLIC_RELEASE" ] } }  # Growser-146'
