substitutions:
  - description:
      Rename ReloadBypassingCache to ReloadBypassingCache_ChromiumImpl to avoid
      conflict with Brave implementation
    regex:
      re_pattern: (void ReloadBypassingCache)\(
      replace: \1_ChromiumImpl(

  - description:
      Replace chrome::kChromeUISplitViewNewTabPageURL to kChromeUINewTabURL in
      NewSplitTab(). We don't want to have a separate NTP URL for split view.
    regex:
      re_pattern: |-
        (void NewSplitTab\(.*?)(chrome::kChromeUISplitViewNewTabPageURL)(.*?^})
      re_flags: [DOTALL, MULTILINE]
      replace: \1chrome::kChromeUINewTabURL\3

  - description:
      Nullify toast controller in CloseTab() not to show toast when closing a
      pinned tab
    regex:
      re_pattern: (void CloseTab\(.*?toast_controller\(\);)
      re_flags: [DOTALL]
      replace: \1\n  toast_controller = nullptr;

  - description:
      Insert a detached tree-tab subtree via InsertDetachedTreeTabNodeAt instead
      of InsertDetachedSplitTabAt, so moving a tab with children to a new window
      (via MoveTabsToWindowImpl) preserves the tree hierarchy instead of
      flattening it.
    regex:
      re_pattern: "(InsertDetachedTabGroupAt\\(std::move\\(\\*collection\\),\\s*target_model->count\\(\\)\\);\\s*\\}\\s*)else(\\s*\\{)"
      re_flags: [DOTALL]
      replace:
        "\\1else if
        (std::holds_alternative<\n                     std::unique_ptr<tabs::TreeTabNodeTabCollection>>(\n                     collection->get()->collection_))\\2\n        target_model->InsertDetachedTreeTabNodeAt(std::move(*collection),\n                                                  target_model->count());\n      }
        else\\2"
