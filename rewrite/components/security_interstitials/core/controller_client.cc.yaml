substitutions:
  - description: |-
      Growser-344: "Learn more" on every Chromium warning page - dangerous
      site, certificate error - comes from this one constant, and it sent the
      user to Google's Chrome help. We do not send a user to Google for help
      with this browser (#81). The page appends ?p=<article>&hl=<locale>,
      which growser.org ignores.
    regex:
      pattern: 'const char kHelpCenterUrl[] = "https://support.google.com/chrome/";'
      replace: |-
        // Growser-344: our page, not Google's Chrome help.
        const char kHelpCenterUrl[] = "https://growser.org/features.html#security-warnings";
