substitutions:
  - description: |-
      Keep attributionSrc exposed to match Chrome's shape (growser#109).

      ResolveInvalidConfigurations() takes the AttributionReporting Blink
      runtime feature down when kConversionMeasurement is disabled, which we
      disable. But that Blink feature is status:stable, so stock Chrome
      exposes the attributionSrc IDL attribute on <a>/<area>/<img>/<script>,
      and taking it down makes `"attributionSrc" in HTMLAnchorElement.prototype`
      answer false here - a one-line JS tell that we are not Chrome (the #82
      condition). Neutralizing the guard leaves the feature at its stable
      default, so the attribute is present exactly as in Chrome. Nothing can
      register through it: kConversionMeasurement stays disabled browser-side
      and its implementation was deleted upstream in 152, so this is pure
      surface parity, not a data flow.

      Growser-236: Chromium 154 moved this. The guard in
      ResolveInvalidConfigurations() is gone; the Blink feature is now driven
      from a table, `runtimeFeatureNameToChromiumFeatureMapping`, and the row
      `{"AttributionReporting", raw_ref(...kConversionMeasurement)}` does what
      the guard used to do - our browser-side disable takes the Blink feature
      with it, and attributionSrc disappears from the IDL again. So the
      substitution is now the row rather than the condition: with no row,
      nothing drives the feature and it keeps its status:stable default, which
      is the state Chrome ships. Same outcome, one layer up.
    regex:
      re_pattern: '\{"AttributionReporting",\s*raw_ref\(attribution_reporting::features::kConversionMeasurement\)\},'
      replace: '// growser #109: no row here on purpose - AttributionReporting keeps its stable default so attributionSrc stays exposed as in Chrome.'
