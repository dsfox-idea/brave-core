substitutions:
  - description: |-
      Upgrade all mixed content.
    set_feature_flag_default_state:
      feature_name: kMixedContentAutoupgrade
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kReducedReferrerGranularity enabled.'
    set_feature_flag_default_state:
      feature_name: kReducedReferrerGranularity
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kUACHOverrideBlank enabled.'
    set_feature_flag_default_state:
      feature_name: kUACHOverrideBlank
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kAllowURNsInIframes disabled.'
    set_feature_flag_default_state:
      feature_name: kAllowURNsInIframes
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kBackgroundResourceFetch disabled.'
    set_feature_flag_default_state:
      feature_name: kBackgroundResourceFetch
      value: base::FEATURE_DISABLED_BY_DEFAULT

  # growser#82, retired by growser#174. This entry was deleted for a while:
  # a browser with kFencedFrames disabled killed the renderer on any
  # <fencedframe>, because the element was exposed from the json5 default
  # whatever this feature said, and its mojo call came back as
  # ReceivedBadMessage. Upstream reached the same diagnosis - 6cdda144396,
  # "Fix renderer kill on <fencedframe> creation" - and fixed the cause
  # instead of the symptom: the runtime flag is switched off now too, so the
  # element is never exposed and nothing sends that mojo. Leaving
  # browser-side support on would only buy an ads-stack surface no page can
  # reach. Their own browser test covers the crash
  # (FencedFrameDisabledTest.CreatingFencedFrameDoesNotKillTab).
  - description: 'Ship kFencedFrames disabled.'
    set_feature_flag_default_state:
      feature_name: kFencedFrames
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kPreloadingEagerViewportHeuristics disabled.'
    set_feature_flag_default_state:
      feature_name: kPreloadingEagerViewportHeuristics
      value: base::FEATURE_DISABLED_BY_DEFAULT
