<link rel="import" href="chrome://resources/cr_elements/md_select.css.html">

<style include="settings-shared md-select">
</style>

<settings-section
  id="newTab"
  page-title="$i18n{braveNewTab}">

  <div class="settings-box first">
    <div class="flex cr-padded-text" aria-hidden="true">
      $i18n{braveNewTabNewTabPageShows}
    </div>
    <settings-dropdown-menu
      label="$i18n{braveNewTabNewTabPageShows}"
      pref-key="brave.new_tab_page.shows_options"
      menu-options="[[newTabShowOptions_]]">
    </settings-dropdown-menu>
  </div>
  <!-- growser (#136): the "customize the new tab page" row is gone. It opened
       chrome://newTab?openSettings=1, which is the way into the page's own
       settings modal - and those are no longer reachable, by design. What the
       new tab SHOWS stays a choice; how the dashboard looks is not one any
       more. The handler and its listener are left in the TypeScript so the
       row is one markup block away from coming back. -->

</settings-section>
