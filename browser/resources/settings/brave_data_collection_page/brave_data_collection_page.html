<style include="settings-shared"></style>
<settings-section page-title="$i18n{braveDataCollection}">
  <!-- growser (#21): the P3A toggle is gone - telemetry is removed, so there
       is nothing to opt into from settings. The other toggles (stats usage
       ping, metrics reporting) are not P3A and stay. -->
  <!-- growser (#78): the usage ping is compiled out of this build
       (ENABLE_BRAVE_STATS_UPDATER is 0), so the toggle controlled nothing.
       Hidden in the template rather than by a grit conditional: that
       variable is not among this target's defines, and naming it fails the
       build with "undefined Grit variable" - which grit reports even when the
       conditional sits inside an HTML comment, since that is how Brave writes
       them elsewhere in this tree (lesson 12). -->
  <template is="dom-if" if="[[false]]">
    <settings-toggle-button id="statsUsagePingEnabled"
        class="cr-row"
        checked="[[statsUsagePingEnabled_]]"
        label="$i18n{statsUsagePingEnabledTitle}"
        sub-label="$i18n{statsUsagePingEnabledDesc}"
        on-settings-boolean-control-change="onStatsUsagePingEnabledChange_">
    </settings-toggle-button>
  </template>
  <settings-toggle-button id="metricsReportingControl"
      class="hr"
      checked="[[metricsReportingEnabled_]]"
      disabled="[[isMetricsReportingManaged_]]"
      label="$i18n{enablePersonalizationLogging}"
      sub-label="$i18n{enablePersonalizationLoggingDesc}"
      on-settings-boolean-control-change="onMetricsReportingChange_">
    <template is="dom-if" if="[[showRestartForMetricsReporting_]]" restamp>
      <cr-button on-click="restartBrowser_" id="restart"
          slot="more-actions">
        $i18n{restart}
      </cr-button>
    </template>
  </settings-toggle-button>
<if expr="enable_brave_ads">
  <template is="dom-if" if="[[showSponsoredAdsEnabledToggle_]]">
    <settings-toggle-button id="sponsoredAdsEnabled"
        class="hr"
        pref-key="brave.brave_ads.sponsored.enabled"
        label="$i18n{sponsoredAdsEnabledTitle}"
        sub-label="$i18n{sponsoredAdsEnabledDesc}"
        learn-more-url="$i18n{sponsoredAdsLearnMoreURL}">
    </settings-toggle-button>
  </template>
</if>
</settings-section>
