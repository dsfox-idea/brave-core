<link rel="import" href="chrome://resources/cr_elements/md_select.css.html">
<style include="settings-shared md-select">
  .settings-box {
    display: flex;
    justify-content: space-between;
  }
</style>
<div class="settings-box">
  <div class="start" id="labelWrapper">
    <div class="label">$i18n{webRTCPolicyLabel}</div>
    <a id="learnMore" href="$i18n{webRTCLearnMoreURL}" target="_blank">
      $i18n{webRTCPolicySubLabel}
    </a>
  </div>
  <settings-dropdown-menu label="$i18n{webRTCPolicyLabel}"
      pref-key="webrtc.ip_handling_policy"
      menu-options="[[webRTCPolicies_]]">
  </settings-dropdown-menu>
</div>
<!-- growser (#78): "Use Google services for push messaging" is gone. GCM
     registration needs Google API keys, and this build ships none on purpose
     (brave_google_api_key, google_default_client_id and
     google_default_client_secret are all empty in args_generated.gni), so the
     switch could only ever turn on a service that cannot connect. -->
<div class="settings-box">
  <div class="start" id="labelWrapper">
    <div class="label">$i18n{historyRetentionLabel}</div>
    <div class="secondary label" id="sub-label">
      $i18n{historyRetentionSubLabel}
    </div>
  </div>
  <settings-dropdown-menu id="historyRetention"
      pref-key="brave.history.retention_days"
      menu-options="[[historyRetentionOptions_]]">
  </settings-dropdown-menu>
</div>
<settings-toggle-button
  class="cr-row"
  pref="{{prefs.brave.de_amp.enabled}}"
  label="$i18n{deAmpSettingLabel}"
  sub-label="$i18n{deAmpSettingSubLabel}"
  learn-more-url="$i18n{deAmpLearnMoreURL}">
</settings-toggle-button>
<template is="dom-if" if="[[isDebounceFeatureEnabled_]]">
  <settings-toggle-button
    class="cr-row"
    pref="{{prefs.brave.debounce.enabled}}"
    label="$i18n{debounceSettingLabel}"
    sub-label="$i18n{debounceSettingSubLabel}"
    learn-more-url="$i18n{debounceLearnMoreURL}">
  </settings-toggle-button>
</template>
<settings-toggle-button
  class="cr-row"
  pref="{{prefs.brave.reduce_language}}"
  label="$i18n{reduceLanguageControlLabel}"
  sub-label="$i18n{reduceLanguageDesc}">
</settings-toggle-button>
<div hidden="[[!isRequestOTRFeatureEnabled_]]" class="settings-box">
    <div class="start" id="labelWrapper">
        <div class="label">$i18n{requestOTRLabel}</div>
    </div>
    <settings-dropdown-menu id="defaultRequestOTR"
                            pref-key="brave.request_otr.request_otr_action_option"
                            menu-options="[[requestOTRActions_]]">
    </settings-dropdown-menu>
</div>
<!-- <if expr="enable_psst"> -->
<!-- growser (#78): PSST adjusts privacy settings on sites from a rules list
     that arrives as a Brave component. Brave's component server answers
     403 to a fork and Google does not know the id, so the rules can never
     arrive and the toggle would switch on a feature with no rules. -->
<template is="dom-if" if="[[false]]">
  <settings-toggle-button
    class="cr-row"
    pref="{{prefs.brave.psst.settings.enable_psst}}"
    label="$i18n{psstSettingsToggleLabel}"
    sub-label="$i18n{psstSettingsToggleSubLabel}"
    learn-more-url="$i18n{psstLearnMoreURL}">
  </settings-toggle-button>
</template>
<!-- </if> -->

<!-- <if expr="is_win"> -->
  <template is="dom-if" if="[[isWindowsRecallAvailable_]]">
    <settings-toggle-button id="windowsRecallDisabled"
        class="cr-row"
        pref="[[windowsRecallDisabledPref_]]"
        on-settings-boolean-control-change="windowsRecallDisabledChange_"
        label="$i18n{windowsRecallDisabledLabel}"
        sub-label="$i18n{windowsRecallDisabledSubLabel}">
        <template is="dom-if"
                  if="[[shouldShowRestartWindowsRecall_(windowsRecallDisabledPref_.value)]]">
            <cr-button on-click="restartBrowser_" slot="more-actions">
              $i18n{restart}
            </cr-button>
        </template>
    </settings-toggle-button>
  </template>
<!-- </if> -->
<settings-do-not-track-toggle id="doNotTrack" prefs="{{prefs}}">
</settings-do-not-track-toggle>
